name: Validate board

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate board directory
        shell: pwsh
        run: ./scripts/Test-BoardDirectory.ps1
